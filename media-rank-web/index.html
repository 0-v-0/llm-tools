<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>media-rank · 媒体锦标赛排名</title>
</head>

<body>
	<!-- demo 页：MediaSource 在运行时合成图片（canvas）/音频（WAV）/视频
		（canvas + MediaRecorder），无二进制资产。 -->
	<mr-demo class="block max-w-6xl mx-auto p-4">
		<div class="flex items-center justify-between mb-4">
			<h1 class="text-xl font-bold">媒体锦标赛排名 <span class="text-sm font-normal opacity-50">media-rank-web demo</span></h1>
			<div class="flex items-center gap-2 text-sm">
				<label class="flex items-center gap-1">找出前
					<input id="target" type="number" min="1" max="8" value="2" class="input input-bordered input-sm w-20">
					<span>名（≥ 候选数 = 精确全排序）</span>
				</label>
				<button id="start" class="btn btn-primary btn-sm">开始排名</button>
			</div>
		</div>
		<div id="status" class="text-sm opacity-60 mb-2">正在合成示例媒体…</div>
		<div id="mount"></div>
	</mr-demo>

	<script type="module" src="/src/demo/main.ts"></script>
</body>

</html>
